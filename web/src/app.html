<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#e8e4de" />
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<!-- Machine-readable description of the chat for LLM agents (chat feature; static/llms.txt). -->
		<link
			rel="alternate"
			type="text/markdown"
			href="%sveltekit.assets%/llms.txt"
			title="llms.txt — LLM-readable description"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- id="app": chat's modals toggle `inert` on this element (Modal/MobileNav/ChatInput). -->
		<div id="app" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
