# LibreChat v0.8.9 for the database comparison: one custom endpoint, the shared stub model, chosen by
# default so a new chat needs no picking. Everything else is LibreChat's default.
version: 1.3.19
cache: true
endpoints:
  custom:
    - name: "stub"
      apiKey: "not-a-key"
      baseURL: "http://stub:8000/v1"
      models:
        default: ["compare-stub"]
        fetch: false
      titleConvo: true
      titleModel: "compare-stub"
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "compare-stub"
      label: "Compare stub"
      default: true
      preset:
        endpoint: "stub"
        model: "compare-stub"
