# Open WebUI and LibreChat as their own READMEs start them, on their default stores, both talking to
# the stub model (stub.py). run.sh starts this project ("dbcompare") beside Alpha's own compose stack
# and connects the stub to Alpha's network too. Secrets are generated by run.sh per run and exist only
# for the containers' lives.
name: dbcompare

services:
  stub:
    image: docker.io/library/python:3.13-slim@sha256:7249d5587b78209a006dc4a3b5340678f84ea729239193aa559962cd8c1fce50
    command: ["python", "-u", "/stub.py"]
    volumes: ["./stub.py:/stub.py:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      retries: 30

  # Open WebUI v0.13.4 on its default store, SQLite in /app/backend/data. OFFLINE_MODE keeps it from
  # downloading embedding models; the stub is its only model connection.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.4@sha256:d5168bfbc28609eff5bea1b438dd864cf64d185cf6582c02244865e18385b901
    ports: ["127.0.0.1:8080:8080"]
    environment:
      WEBUI_SECRET_KEY: ${OWUI_SECRET_KEY:?run.sh sets it}
      OFFLINE_MODE: "true"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://stub:8000/v1
      OPENAI_API_KEY: not-a-key
      DEFAULT_MODELS: compare-stub
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_SIGNUP: "true"
    volumes: ["owui-data:/app/backend/data"]
    depends_on:
      stub: { condition: service_healthy }

  # LibreChat v0.8.9 as its docker-compose.yml runs it, on MongoDB, with its .env.example defaults:
  # SEARCH=false (so no Meilisearch index), registration open, no RAG API (it handles uploads only).
  librechat-mongo:
    image: docker.io/library/mongo:8.0.20@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    command: mongod --noauth
    volumes: ["librechat-mongo:/data/db"]

  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.9@sha256:4a3967a47031c1fdba8302a6a341be7671101e40b617f7934ba25aac69fcea2b
    ports: ["127.0.0.1:3080:3080"]
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      DOMAIN_CLIENT: http://localhost:3080
      DOMAIN_SERVER: http://localhost:3080
      NO_INDEX: "true"
      SEARCH: "false"
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      CREDS_KEY: ${LC_CREDS_KEY:?run.sh sets it}
      CREDS_IV: ${LC_CREDS_IV:?run.sh sets it}
      JWT_SECRET: ${LC_JWT_SECRET:?run.sh sets it}
      JWT_REFRESH_SECRET: ${LC_JWT_REFRESH_SECRET:?run.sh sets it}
      CONFIG_PATH: /app/librechat.yaml
    volumes: ["./librechat.yaml:/app/librechat.yaml:ro"]
    depends_on:
      stub: { condition: service_healthy }
      librechat-mongo: { condition: service_started }

volumes:
  owui-data:
  librechat-mongo:
