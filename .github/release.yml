# Groups the notes GitHub generates for a release by the labels on its merged PRs. Breaking changes come
# first, since they are what someone running their own copy reads before upgrading. Each release adds a
# short written summary above the generated list.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ci
      - internal
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Security
      labels:
        - security
    - title: Self-hosting
      labels:
        - selfhost
    - title: Added
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
