# Extends gitleaks' default rules. The paths below hold hash-like strings that the generic-api-key rule
# mistakes for keys: translation strings and test fixtures. hardening-test.sh sends a throwaway test
# nonce as a bearer token to a local proxy, which gitleaks 8.21's curl-auth-header rule reads as a credential.
# The paraglide compile cache (gitignored, written by a build) maps each generated message file to its
# sha256 digest, which generic-api-key and jfrog-identity-token read as keys.
[extend]
useDefault = true

[allowlist]
description = "hash-like strings, not secrets"
paths = [
  '''web/messages/translated-from\.json''',
  '''agent-service/api/test_agent_service\.py''',
  '''agent-service/hardening-test\.sh''',
  '''web/project\.inlang/cache/''',
]
# Whole values that gitleaks 8.30's generic-api-key reads as keys, each anchored so a longer real value
# still matches the rule: the recovery-key spec's two made-up age keys, the e2e fault-injection header
# name, and a Mistral model id that sits next to an env key name.
regexes = [
  '''(?i)^age-secret-key-pq-1ab[cd]$''',
  '''^x-e2e-fault-inject$''',
  '''^mistral-large-\d{4}$''',
]
