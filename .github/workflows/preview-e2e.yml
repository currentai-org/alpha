# The scenario suite against a Vercel preview of a pull request's own code.
#
# The Vercel project is not connected to this repository, so nothing else builds a preview of a pull
# request. This workflow deploys one and runs the scenarios against it, the way `provider-contract` in
# e2e.yml does for a merge queue batch.
#
# Only a pull request whose branch is in this repository gets a preview. A preview build reads every
# Preview variable on the Vercel project, and pushing a branch here takes write access, so code from a
# fork, or from Dependabot, never reaches one. Those pull requests are covered by the mock-model job.
#
# It runs in the `preview-e2e` environment, which alone holds VERCEL_TOKEN and SCENARIO_ENV. With either
# missing it says so in a notice and passes.
#
# By hand, for one spec repeated against a pull request's preview:
#   gh workflow run preview-e2e.yml -f pr=<number> -f spec=web/e2e/scenarios/<file>.spec.ts -f repeat=3
name: Preview E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose head is deployed
        required: true
      spec:
        description: Spec path (from the repository root) to run instead of the whole suite
        required: false
        default: ""
      repeat:
        description: Times to run each test
        required: false
        default: "1"

permissions: {}

concurrency:
  group: preview-e2e-${{ github.event.pull_request.number || inputs.pr }}-${{ inputs.spec || 'suite' }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      !github.event.repository.fork &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: preview-e2e
    permissions:
      contents: read
      pull-requests: read
    env:
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
      VERCEL_CLI: vercel@65.14.0
    steps:
      - name: Are the secrets here?
        id: gate
        env:
          SCENARIO_ENV: ${{ secrets.SCENARIO_ENV }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$SCENARIO_ENV" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ] || [ -z "$VERCEL_PROJECT" ]; then
            echo "::notice title=preview e2e skipped::SCENARIO_ENV or VERCEL_TOKEN (preview-e2e environment), VERCEL_SCOPE or VERCEL_PROJECT is not set, so no preview was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # A dispatch names a pull request; its head must be a branch of this repository, as above.
      - name: Which commit
        id: head
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PR" in '' | *[!0-9]*) echo "::error::pr must be a number"; exit 1 ;; esac
          read -r head_repo sha < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.repo.full_name) \(.head.sha)"')
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::#$PR comes from $head_repo, not this repository, so it gets no preview."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false

      - name: Deploy this pull request's preview
        id: preview
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          url=$(npx --yes "$VERCEL_CLI" deploy --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "preview: $url (from $SHA)" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm exec playwright install --with-deps chromium

      - name: Scenarios
        if: steps.gate.outputs.run == 'true'
        working-directory: web
        env:
          # The contents of a dotenv file: one KEY=value per line, with the keys web/.env.example names.
          SCENARIO_ENV: ${{ secrets.SCENARIO_ENV }}
          SCENARIO_BASE_URL: ${{ steps.preview.outputs.base_url }}
          SPEC: ${{ inputs.spec }}
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          set -a
          # shellcheck source=/dev/null
          . <(printf '%s\n' "$SCENARIO_ENV")
          set +a
          case "$REPEAT" in '' | *[!0-9]*) echo "::error::repeat must be a number"; exit 1 ;; esac
          if [ -z "$SPEC" ]; then
            pnpm test:e2e:scenarios --repeat-each "$REPEAT"
            exit 0
          fi
          case "$SPEC" in
            web/e2e/scenarios/*.spec.ts | web/e2e/scenarios/*.spec.ts:[0-9]*) ;;
            *) echo "::error::spec must be a path under web/e2e/scenarios/"; exit 1 ;;
          esac
          pnpm test:e2e:scenarios "${SPEC#web/}" --repeat-each "$REPEAT"

      - name: Upload the report
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
