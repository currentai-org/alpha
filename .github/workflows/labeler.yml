# Adds the path-based release-note labels in .github/labeler.yml to each pull request. It runs on
# pull_request_target so it can label a fork's pull request too; it never checks out or runs the pull
# request's code, which is the use that trigger is safe for.
name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    name: label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
