# What a stranger does with this repository, and the two self-host claims a privacy-minded operator most
# wants proven. `smoke`: `selfhost/smoke.sh` writes selfhost/.env from .env.example, runs
# `docker compose --profile local up --build` with a small local model, and sends one chat turn as a
# signed-out guest; then the daily cleanup deletes an aged guest conversation, and the README's backup and restore run on that stack. `safety-profile`: the Shieldstral screen beside it (report only). `socket-proxy`: the
# agent profile's socket proxy refuses host-root creates. `agent-owui-names`: the agent profile's model
# gateway starts on Open WebUI's env names. `s3-secret`: the s3 profile's SeaweedFS refuses a blank
# secret, and leaving the profile out needs no key. No job reads a secret: models download from
# Hugging Face without a token.
name: Self-host smoke

on:
  # Every pull request, whatever it touches: with e2e.yml's mock-model job, it is the whole end-to-end
  # check a pull request gets, and neither reads a secret.
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: self-host stack boots and answers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MODEL_CACHE_KEY: selfhost-gguf-qwen2.5-0.5b-instruct-q4_k_m-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Model directory
        run: |
          echo "LOCAL_MODELS_DIR=$RUNNER_TEMP/selfhost-models" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/selfhost-models"

      # Restore only: a pull request never writes the cache, so a pull request cannot poison what main reads.
      - name: Restore the model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Build, boot and chat
        id: smoke
        run: ./selfhost/smoke.sh

      # The daily cleanup the README describes ("Expired guest data"), on the stack the smoke left up: a guest
      # conversation aged 40 days is deleted by the web server's own timer, with its first run brought to 5 s
      # after a recreate, and a fresh one is kept (.github/selfhost-cleanup-smoke.sh). Before the restore,
      # which wipes the stack. A failure fails the job.
      - name: The daily cleanup deletes an expired guest conversation
        if: steps.smoke.outcome == 'success'
        run: |
          set +e
          ./.github/selfhost-cleanup-smoke.sh 2>&1 | tee cleanup.log
          code=${PIPESTATUS[0]}
          {
            echo "### daily cleanup"
            echo '```'
            grep -E '^(ok|CLEANUP)' cleanup.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo "::error title=selfhost cleanup::the daily cleanup smoke exited $code. Read this step's log."
          fi
          exit "$code"

      # The README's backup and restore, on the stack the smoke left up: a guest conversation and a file in
      # the `files` volume, selfhost/backup.sh, `down -v`, `up`, selfhost/restore.sh, then every conversation
      # must read back identical, the guest must open theirs with the same cookie, and the file must hold
      # what was written (.github/selfhost-restore-smoke.sh). Capture-and-warn for its first runs.
      - name: Back up, wipe, restore, and find the conversation and the file again
        if: always() && steps.smoke.outcome == 'success'
        run: |
          set +e
          ./.github/selfhost-restore-smoke.sh 2>&1 | tee restore.log
          code=${PIPESTATUS[0]}
          {
            echo "### restore round trip"
            echo '```'
            grep -E '^(ok|RESTORE|BACKUP)' restore.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo "::warning title=selfhost restore::the restore round trip exited $code. Read this step's log."
          fi
          exit 0

      # The README's database password change, on the stack the smoke left up: selfhost/db-passwd.sh, the
      # new value in selfhost/.env, `up -d`, and the app must reconnect and read back a guest's conversation;
      # then .env changed alone must lock the app out, and the script must bring it back
      # (.github/selfhost-db-passwd-smoke.sh). Capture-and-warn for its first runs.
      - name: Change the database password and find the app reconnected
        if: steps.smoke.outcome == 'success'
        run: |
          set +e
          ./.github/selfhost-db-passwd-smoke.sh 2>&1 | tee db-passwd.log
          code=${PIPESTATUS[0]}
          {
            echo "### database password change"
            echo '```'
            grep -E '^(ok|DB PASSWD)' db-passwd.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            echo "::warning title=selfhost db password::the password change check exited $code. Read this step's log."
          fi
          exit 0

      - name: Save the model cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Tear the stack down
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        working-directory: selfhost
        run: docker compose --profile local down -v

  safety-profile:
    # The safety profile (selfhost/compose.yaml, service shieldstral): Shieldstral-1.0-3B on llama.cpp on
    # the runner's CPU beside the local profile, with GUARD_SHADOW_URL pointed at it, so the screen
    # enforces. .github/selfhost-safety-smoke.sh sends one benign and one clearly disallowed guest turn and
    # reports each verdict from the turn's stream and the web log, plus whether llama.cpp returned the
    # top_logprobs the app scores with, and prints the classifier's timings to the run summary.
    # No secret: both models download from Hugging Face without a token. The two chat turns are report-only:
    # on a CPU runner the screen often runs out of time and declines (selfhost/README.md says why), so a
    # wrong turn outcome annotates the run and the job stays green. The direct classifier call does not
    # depend on CPU speed, so a missing yes/no top_logprobs pair is a failure of its own (exit 2 from the
    # script) and fails the job.
    # The disallowed turn's answer text is neither printed nor uploaded.
    name: safety profile screens two turns (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The key names both GGUFs compose.yaml defaults to; bump it when either changes.
      MODEL_CACHE_KEY: selfhost-gguf-qwen2.5-0.5b-q4_k_m-shieldstral-1.0-3b-q4_k_m-abiray-45dfb42-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Model directory
        run: |
          echo "LOCAL_MODELS_DIR=$RUNNER_TEMP/selfhost-models" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/selfhost-models"

      # Restore only: a pull request never writes the cache, so a pull request cannot poison what main reads.
      - name: Restore the model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Boot the stack with the safety profile and screen two turns
        id: smoke
        run: |
          set +e
          mkdir -p smoke-logs
          echo "$(nproc) CPUs, $(free -g | awk '/^Mem:/ {print $2}') GiB" >> "$GITHUB_STEP_SUMMARY"
          # .env.example as a forker copies it, plus the one line README.md's safety section adds.
          sed "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" selfhost/.env.example > selfhost/.env
          echo "GUARD_SHADOW_URL=http://shieldstral:8080" >> selfhost/.env
          started=$(date +%s)
          (cd selfhost && docker compose --profile local --profile safety up -d --build --wait --wait-timeout 1500) 2>&1 | tee smoke-logs/up.log
          up=${PIPESTATUS[0]}
          echo "stack up exited $up in $(($(date +%s) - started)) s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$up" = 0 ]; then
            ./.github/selfhost-safety-smoke.sh 2>&1 | tee smoke-logs/safety.log
            code=${PIPESTATUS[0]}
          else
            code=$up
            (cd selfhost && docker compose --profile local --profile safety logs --no-color --tail 120 web shieldstral) > smoke-logs/up-failure.log 2>&1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "safety profile smoke exited $code" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^SAFETY |^classifier calls timed|prompt eval time|^classifier container|"msg"' smoke-logs/safety.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" = 2 ]; then
            # The classifier returned no yes/no top_logprobs pair, so the app cannot score any rule; CPU speed
            # does not explain that, so it fails the job.
            echo "::error title=selfhost safety classifier::the classifier returned no yes/no top_logprobs pair, so the screen cannot score its rules. Read safety-direct.json in the selfhost-safety artifact."
            exit 1
          elif [ "$code" != 0 ]; then
            echo "::warning title=selfhost safety profile::the safety profile smoke exited $code. Read safety.log in the selfhost-safety artifact."
          fi
          exit 0

      - name: Save the model cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.smoke.outputs.code == '0'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Tear the stack down
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        working-directory: selfhost
        run: docker compose --profile local --profile safety down -v

      - name: Keep the smoke's log
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost-safety
          # The smoke keeps no raw stream of the disallowed turn; the exclusion keeps one out if it ever does.
          path: |
            smoke-logs/
            !smoke-logs/safety-disallowed.ndjson
          retention-days: 7
          if-no-files-found: warn

  gpu-config:
    # selfhost/compose.gpu.yaml without a GPU, since no runner has one: .github/selfhost-gpu-config-check.sh
    # requires `docker compose -f compose.yaml -f compose.gpu.yaml config` to give llama and shieldstral an
    # NVIDIA device request, the pinned server-cuda image and LLAMA_ARG_N_GPU_LAYERS=all, compose.yaml alone
    # to give them none, and both llama.cpp pins to be the same release. Starts nothing. Whether a model
    # actually runs on a GPU is untested in CI. Capture-and-warn for its first runs.
    name: GPU override requests the device
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: The merged GPU config requests an NVIDIA device
        run: |
          set +e
          ./.github/selfhost-gpu-config-check.sh 2>&1 | tee gpu-config.log
          code=${PIPESTATUS[0]}
          {
            echo "### GPU override"
            echo '```'
            grep -E '^(PASS|FAIL|releases:|GPU CONFIG)' gpu-config.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=selfhost gpu config::the GPU config check exited $code. Read the FAIL lines in this step's log."
          fi
          exit 0

  env-drift:
    # selfhost/.env.example against the compose files, both ways (.github/selfhost-env-drift.sh): every
    # ${NAME} a compose file reads must appear in .env.example, and every .env.example key must be read by
    # a compose file or declared in web/config/env-manifest.mjs, since web loads all of .env. Then
    # `docker compose config` must render for each profile and for the GPU override. Starts nothing.
    # Capture-and-warn for its first runs.
    name: env file and compose agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Every setting compose reads is in .env.example, and every .env.example key is read
        run: |
          set +e
          ./.github/selfhost-env-drift.sh 2>&1 | tee env-drift.log
          code=${PIPESTATUS[0]}
          {
            echo "### env file and compose"
            echo '```'
            grep -E '^(ok|DRIFT|ENV DRIFT)' env-drift.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=selfhost env drift::the env drift check exited $code. Read the DRIFT lines in this step's log."
          fi
          exit 0

  socket-proxy:
    # The Docker socket proxy agent mode's sandbox goes through (sockguard, agent profile in
    # selfhost/compose.yaml, policy in selfhost/sockguard.yaml). .github/selfhost-socket-proxy-smoke.sh
    # starts only that service and requires a plain create and an internal network's lifecycle to pass,
    # and each of these creates to be refused with sockguard's own message: a `-v /:/host` bind, a bind of
    # the Docker socket, a `--mount` bind of /, a local-driver volume bound to /, `--privileged`,
    # `--cap-add SYS_ADMIN`, `--device /dev/null`, `--pid host`, `--ipc host`, `--network host` and
    # `--security-opt seccomp=unconfined`. So a sockguard upgrade or a policy edit that lets a caller of
    # the proxy reach host root fails here.
    # Then agent-service's docker sandbox backend runs its contract and live hardening tests through the
    # same proxy: a command runs as uid 1000 with no capability on a read-only root, run-code reaches no
    # network, an agent sandbox reaches only the gateway, and a privileged create, a host-root bind and a
    # root exec sent the backend's way come back 403. A skipped test fails the job too.
    # No secret, no model, two small images pulled. Blocking: a FAIL line fails the job.
    name: socket proxy refuses host-root creates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Refuse host-root creates through the socket proxy
        env:
          SOCKET_PROXY_LOG: sockguard.log
        run: |
          set +e
          ./.github/selfhost-socket-proxy-smoke.sh 2>&1 | tee socket-proxy.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### socket proxy"
            echo '```'
            grep -E '^(sockguard:|sandbox backend:|PASS|FAIL|"reason"|SOCKET PROXY)' socket-proxy.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error title=selfhost socket proxy::the socket-proxy check exited $code. A FAIL line on a host-root create means the proxy let it through. Read socket-proxy.log in the job log."
          fi
          exit "$code"

  s3-secret:
    # The s3 profile's SeaweedFS refuses a blank key pair, and people who leave the profile out need no
    # key (.github/selfhost-s3-secret-smoke.sh). Compose renders the file and runs `down` with no S3 key;
    # SeaweedFS with a blank secret exits non-zero and prints `openssl rand -hex 32`; with a secret, and
    # with only deploy/'s FILES_ACCESS_KEY and FILES_SECRET_KEY, it comes up healthy.
    # No secret, no model, one image pulled. Capture-and-warn for its first runs: a FAIL line is a
    # ::warning:: and the job stays green, so read the step summary, not the check's colour.
    name: s3 profile refuses a blank secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Boot the s3 profile with a blank secret, then with a secret
        run: |
          set +e
          ./.github/selfhost-s3-secret-smoke.sh 2>&1 | tee s3-secret.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### s3 profile secret"
            echo '```'
            grep -E '^(seaweedfs:|blank secret:|PASS|FAIL|S3 SECRET)' s3-secret.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=selfhost s3 secret::the s3-secret check exited $code. Read the FAIL lines in s3-secret.log in the job log."
          fi
          exit 0

  agent-owui-names:
    # Agent mode for an operator moving from Open WebUI: the agent profile's model gateway started with only
    # Open WebUI's OPENAI_API_BASE_URLS / OPENAI_API_KEYS in selfhost/.env (block C of .env.example, block A's
    # OPENAI_BASE_URL removed). .github/selfhost-agent-owui-smoke.sh requires the gateway to refuse to start
    # with neither name set, then to come up healthy on the Open WebUI names with the list's first URL as its
    # one provider, and a /v1/models call on a grant to come back from the local llama.cpp through it.
    # No secret: the local model downloads from Hugging Face without a token. Capture-and-warn while new.
    name: agent gateway starts on Open WebUI's env names
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      MODEL_CACHE_KEY: selfhost-gguf-qwen2.5-0.5b-instruct-q4_k_m-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Model directory
        run: |
          echo "LOCAL_MODELS_DIR=$RUNNER_TEMP/selfhost-models" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/selfhost-models"

      # Restore only: the smoke job on main writes this cache.
      - name: Restore the model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: The agent gateway starts on Open WebUI's env names and forwards to the first URL
        run: |
          set +e
          ./.github/selfhost-agent-owui-smoke.sh 2>&1 | tee agent-owui-names.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### agent gateway on Open WebUI's env names"
            echo '```'
            grep -E '^(PASS|FAIL|gateway log:|healthz providers:|models via gateway:|AGENT OWUI NAMES)' agent-owui-names.log | cut -c1-400 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=selfhost agent on Open WebUI names::the check exited $code. Read agent-owui-names.log in the job log: a FAIL line names the claim, and the gateway log follows it."
          fi
          exit 0
