# What a stranger does with this repository: `selfhost/smoke.sh` writes selfhost/.env from .env.example,
# runs `docker compose --profile local up --build` with a small local model, and sends one chat turn as a
# signed-out guest. No secret: the model downloads from Hugging Face without a token.
name: Self-host smoke

on:
  pull_request:
    paths:
      - "selfhost/**"
      - "deploy/smoke.sh"
      - "web/Dockerfile"
      - "web/Dockerfile.dockerignore"
      - "web/drizzle/**"
      - "web/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/selfhost.yml"
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: self-host stack boots and answers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MODEL_CACHE_KEY: selfhost-gguf-qwen2.5-0.5b-instruct-q4_k_m-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Model directory
        run: |
          echo "LOCAL_MODELS_DIR=$RUNNER_TEMP/selfhost-models" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/selfhost-models"

      # Restore only: a pull request never writes the cache, so a pull request cannot poison what main reads.
      - name: Restore the model cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Build, boot and chat
        run: SMOKE_DOWN=1 ./selfhost/smoke.sh

      - name: Save the model cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}
