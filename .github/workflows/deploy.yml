# Deploys the web app to the Vercel project, the way a self-hoster deploys a release:
#   - every push to main: a preview build, aliased to the develop host (DEVELOP_HOST) once its smoke passes.
#   - a release tag on main, vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-rc.N: a production build, which takes the
#     production domain once its smoke passes and moves back if the domain's smoke fails. image.yml publishes the signed image from the same
#     tag, so one tag ships both. Any other pre-release tag (vX.Y.Z-beta) publishes an image and deploys nothing.
# A manual run (workflow_dispatch) does the same from the ref it is started on: main for develop, a release
# tag for production. Any other ref deploys nothing.
#
# Every smoke (.github/scripts/deploy-smoke.sh) checks the identity the build serves and sends one real guest
# chat turn, judged on errors and declines only. A turn that fails on the new build is sent to the build the
# host serves now:
#   - the serving build answers: the new build is at fault. It never takes the host, or the host moves back.
#     On develop the revert job then opens a revert of the merge, at most one an hour.
#   - the serving build fails too: the provider is the likely fault, so the deploy goes ahead with a warning,
#     tells the alerts channel, and the recheck job smokes the host every 15 minutes for 3 hours. It moves the
#     host back if the new build still fails once the serving build answers, and ends red if neither answers
#     by then.
#   - nothing served the host before (a first deploy): the new build is at fault.
# A failed health check gets the same comparison, because the model list comes from the provider at boot.
# A failed identity check always counts against the new build. A manual run's prove_red input breaks one
# run on purpose, to show the gate holds: `identity` deploys without the identity file, `answer` deploys
# with every input safety screen on a closed port (every turn declines), and `provider` (develop only) deploys two
# builds with every model base URL on a closed port and smokes one against the other, moving no host.
#
# The Vercel project is not connected to this repository, so no branch, pull request, fork or Dependabot
# update ever builds there with the project's secrets; this workflow is the only way a commit reaches it.
# Each job runs in its own environment, so neither job's secrets reach the other:
#   - `web-develop` admits only main, and holds VERCEL_TOKEN, VERCEL_BYPASS_SECRET (Vercel's deployment
#     protection bypass, sent when set) and the variable DEVELOP_HOST.
#   - `web-production` admits only tags matching v*.*.*, and holds VERCEL_TOKEN and the variable
#     PRODUCTION_HOST, which a configured project must set. It may hold VERCEL_BYPASS_SECRET too.
# Both may hold SLACK_ALERT_WEBHOOK, the alerts channel's incoming webhook (.github/scripts/tell-alerts.sh).
# Neither has required reviewers: a reviewed merge to main is the gate for develop, and a merged release
# pull request is the gate for production. The jobs' own ref checks back the environments' rules. It is not
# `production`, which holds the agent service's deploys. Repository variables VERCEL_SCOPE (the Vercel team)
# and VERCEL_PROJECT name the target. A fork or a copy without them gets a notice and deploys nothing.
# Each environment's variable DEPLOYMENT_JSON is the installation's identity file (hosts, status page,
# passkey domain, mail sender), written into the build by .github/scripts/write-deployment-config.sh.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      prove_red:
        description: >-
          Break this run on purpose, to show the gate holds: `identity` drops the identity file, `answer`
          puts every input safety screen on a closed port, `provider` (develop only) smokes two builds with dead model
          base URLs against each other and moves no host
        type: choice
        options: [none, identity, answer, provider]
        default: none
      recheck_minutes:
        description: How long the recheck watches a deploy that went ahead on a provider failure
        type: string
        default: "180"

permissions:
  contents: read

env:
  PROVE_RED: ${{ inputs.prove_red || 'none' }}
  RECHECK_MINUTES: ${{ inputs.recheck_minutes || '180' }}
  VERCEL_CLI: vercel@65.14.0
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Every model base URL the app reads, for prove_red's dead provider. Port 9 refuses the connection.
  DEAD_PROVIDER: >-
    OPENAI_BASE_URL MISTRAL_BASE_URL MISTRAL_CHAT_BASE_URL FALLBACK_BASE_URL HF_BASE_URL CLEF_BASE_URL
    SECOND_OPINION_BASE_URL FOLKWAYS_UPSTREAM_BASE_URL

jobs:
  develop:
    name: Deploy main to develop
    # main only, and never for Dependabot: its updates reach main through a reviewed pull request like any other.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: web-develop
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    outputs:
      rolled_back: ${{ steps.after.outputs.rolled_back }}
      provider_down: ${{ steps.before.outputs.provider_down || steps.after.outputs.provider_down }}
      watch: ${{ steps.deploy.outputs.url }}
      current: ${{ steps.prev.outputs.url }}
    env:
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
      DEVELOP_HOST: ${{ vars.DEVELOP_HOST }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
      SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
    steps:
      - name: Is a Vercel project configured
        id: configured
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ] || [ -z "$VERCEL_PROJECT" ] || [ -z "$DEVELOP_HOST" ]; then
            echo "::notice title=deploy skipped::VERCEL_TOKEN or DEVELOP_HOST (web-develop environment), VERCEL_SCOPE or VERCEL_PROJECT is not set, so nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.configured.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.configured.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          # A release build must not read a cache another run could have written.
          package-manager-cache: false

      - name: Write the installation's identity file
        if: steps.configured.outputs.run == 'true'
        env:
          DEPLOYMENT_JSON: ${{ vars.DEPLOYMENT_JSON }}
        run: .github/scripts/write-deployment-config.sh && .github/scripts/deploy-prove-red.sh identity

      - name: Deploy a preview build
        id: deploy
        if: steps.configured.outputs.run == 'true'
        run: |
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          read -ra extra < <(.github/scripts/deploy-prove-red.sh env) || true  # read is 1 on no output
          url=$(npx --yes "$VERCEL_CLI" deploy --yes "${extra[@]}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $VERCEL_PROJECT (preview) at $url from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROVE_RED" = provider ]; then
            # The stand-in for the build the host serves: the same dead provider, so both turns fail.
            standin=$(npx --yes "$VERCEL_CLI" deploy --yes "${extra[@]}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
            echo "standin=$standin" >> "$GITHUB_OUTPUT"
            echo "prove_red=provider: $standin stands in for the build $DEVELOP_HOST serves" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record the deployment the develop host serves now
        id: prev
        if: steps.configured.outputs.run == 'true'
        env:
          STANDIN: ${{ steps.deploy.outputs.standin }}
        run: |
          if [ -n "$STANDIN" ]; then echo "url=$STANDIN" >> "$GITHUB_OUTPUT"; exit 0; fi
          # None on a project's first deploy: a failed turn then counts against the new build.
          prev=$(npx --yes "$VERCEL_CLI" api "/v13/deployments/$DEVELOP_HOST" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | jq -r '.url // empty') || prev=""
          echo "url=${prev:+https://$prev}" >> "$GITHUB_OUTPUT"
          echo "$DEVELOP_HOST served ${prev:-nothing} before this run" >> "$GITHUB_STEP_SUMMARY"

      # A build at fault never takes the develop host: the host keeps the build it served.
      - name: Smoke the deployment before the alias moves
        id: before
        if: steps.configured.outputs.run == 'true'
        env:
          BASE: ${{ steps.deploy.outputs.url }}
          CURRENT: ${{ steps.prev.outputs.url }}
          PROVIDER_DOWN_OK: "1"
        run: .github/scripts/deploy-smoke.sh

      - name: Point the develop host at this deployment
        if: steps.configured.outputs.run == 'true' && env.PROVE_RED != 'provider'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: npx --yes "$VERCEL_CLI" alias set "$URL" "$DEVELOP_HOST" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      # Red here means the merge broke the develop host: the host goes back to the build it served, and the
      # revert job opens a pull request that reverts the merge.
      - name: Smoke the develop host, and move it back if broken
        id: after
        if: steps.configured.outputs.run == 'true' && env.PROVE_RED != 'provider'
        env:
          PREV: ${{ steps.prev.outputs.url }}
        run: |
          rc=0
          BASE="https://$DEVELOP_HOST" CURRENT="$PREV" PROVIDER_DOWN_OK=1 .github/scripts/deploy-smoke.sh || rc=$?
          [ "$rc" = 0 ] && exit 0
          echo "rolled_back=true" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ]; then
            echo "::error::the smoke failed on $DEVELOP_HOST; moving it back to $PREV"
            npx --yes "$VERCEL_CLI" alias set "$PREV" "$DEVELOP_HOST" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          else
            echo "::error::the smoke failed on $DEVELOP_HOST, and it served nothing before, so it stays on this build"
          fi
          exit 1

      - name: Tell the alerts channel the deploy went ahead on a provider failure
        if: steps.before.outputs.provider_down == 'true' || steps.after.outputs.provider_down == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: >-
          .github/scripts/tell-alerts.sh "🟠 develop deployed $GITHUB_SHA although no guest turn answered, on the new
          build or on the one $DEVELOP_HOST served. The model provider is the likely fault. The recheck smokes it
          every 15 minutes for $RECHECK_MINUTES minutes."

  revert:
    name: Open a revert of the merge that broke develop
    needs: develop
    if: always() && needs.develop.outputs.rolled_back == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: web-develop
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Push a revert branch and open its pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: .github/scripts/open-develop-revert.sh

  recheck-develop:
    name: Recheck develop after a provider failure
    needs: develop
    if: needs.develop.outputs.provider_down == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: web-develop
    # A later run's recheck replaces this one; this one also ends once the host serves another deployment.
    concurrency:
      group: recheck-develop
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
      SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Write the installation's identity file
        env:
          DEPLOYMENT_JSON: ${{ vars.DEPLOYMENT_JSON }}
        run: .github/scripts/write-deployment-config.sh && .github/scripts/deploy-prove-red.sh identity
      - name: Smoke the develop host every 15 minutes
        id: recheck
        env:
          WATCH: ${{ needs.develop.outputs.watch }}
          CURRENT: ${{ needs.develop.outputs.current }}
          HOST: ${{ env.PROVE_RED != 'provider' && vars.DEVELOP_HOST || '' }}
          MOVE_BACK: alias
        run: .github/scripts/deploy-recheck.sh
      - name: Open a revert of the merge
        if: failure() && steps.recheck.outputs.rolled_back == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/open-develop-revert.sh

  production:
    name: Deploy a release to production
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: web-production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      provider_down: ${{ steps.before.outputs.provider_down || steps.after.outputs.provider_down }}
      watch: ${{ steps.deploy.outputs.url }}
      current: ${{ steps.prev.outputs.url }}
    env:
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
      SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Is a Vercel project configured
        id: configured
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ] || [ -z "$VERCEL_PROJECT" ]; then
            echo "::notice title=deploy skipped::VERCEL_TOKEN (web-production environment), VERCEL_SCOPE or VERCEL_PROJECT is not set, so nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(preview|rc)\.[0-9]+)?$ ]]; then
            echo "::notice title=deploy skipped::$TAG is not a release tag vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-rc.N (another pre-release publishes its image only), so nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PRODUCTION_HOST" ]; then
            # Without it the deployment would take its domains unsmoked, with nothing to move back to.
            echo "::error::PRODUCTION_HOST (web-production environment) is not set. Set it to the production domain, so a release is smoked there before it serves and moved back if it breaks."
            exit 1
          elif [ "$PROVE_RED" = provider ]; then
            echo "::notice title=deploy skipped::prove_red=provider runs on develop only, so nothing was deployed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.configured.outputs.run == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main
        if: steps.configured.outputs.run == 'true'
        run: |
          # HEAD is the tagged commit whether the tag is lightweight or annotated, and whether release-please
          # or a maintainer pushed it.
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG ($commit) is not on main. A release tags a commit on main: the release pull request's merge, or a maintainer's tag of main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.configured.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          # A release build must not read a cache another run could have written.
          package-manager-cache: false

      - name: Write the installation's identity file
        if: steps.configured.outputs.run == 'true'
        env:
          DEPLOYMENT_JSON: ${{ vars.DEPLOYMENT_JSON }}
        run: .github/scripts/write-deployment-config.sh && .github/scripts/deploy-prove-red.sh identity

      - name: Deploy without the domain
        id: deploy
        if: steps.configured.outputs.run == 'true'
        run: |
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          read -ra extra < <(.github/scripts/deploy-prove-red.sh env) || true  # read is 1 on no output
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --skip-domain --yes "${extra[@]}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $VERCEL_PROJECT (production) at $url from $TAG ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the deployment the domain serves now
        id: prev
        if: steps.configured.outputs.run == 'true'
        run: |
          # None on a project's first deploy: a failed turn then counts against the new build.
          prev=$(npx --yes "$VERCEL_CLI" api "/v13/deployments/$PRODUCTION_HOST" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | jq -r '.url // empty') || prev=""
          echo "url=${prev:+https://$prev}" >> "$GITHUB_OUTPUT"
          echo "$PRODUCTION_HOST served ${prev:-nothing} before this run" >> "$GITHUB_STEP_SUMMARY"

      # A build at fault leaves the domain on the release it serves: this deployment never takes it.
      - name: Smoke the deployment before the domain moves
        id: before
        if: steps.configured.outputs.run == 'true'
        env:
          BASE: ${{ steps.deploy.outputs.url }}
          CURRENT: ${{ steps.prev.outputs.url }}
          PROVIDER_DOWN_OK: "1"
        run: .github/scripts/deploy-smoke.sh

      - name: Move the domain to this deployment
        if: steps.configured.outputs.run == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -o pipefail
          id_of() { npx --yes "$VERCEL_CLI" api "/v13/deployments/$1" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | jq -er .id; }
          want=$(id_of "${URL#https://}")
          npx --yes "$VERCEL_CLI" promote "$URL" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          got=$(id_of "$PRODUCTION_HOST")
          if [ "$got" != "$want" ]; then
            echo "::error::$PRODUCTION_HOST serves $got, not this run's deployment $want."
            exit 1
          fi

      - name: Smoke the domain, and move it back if broken
        id: after
        if: steps.configured.outputs.run == 'true'
        env:
          PREV: ${{ steps.prev.outputs.url }}
        run: |
          rc=0
          BASE="https://$PRODUCTION_HOST" CURRENT="$PREV" PROVIDER_DOWN_OK=1 .github/scripts/deploy-smoke.sh || rc=$?
          [ "$rc" = 0 ] && exit 0
          if [ -n "$PREV" ]; then
            echo "::error::the smoke failed on $PRODUCTION_HOST; moving it back to $PREV"
            npx --yes "$VERCEL_CLI" promote "$PREV" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          else
            echo "::error::the smoke failed on $PRODUCTION_HOST, and it served nothing before, so it stays on this release"
          fi
          exit 1

      - name: Tell the alerts channel the release went ahead on a provider failure
        if: steps.before.outputs.provider_down == 'true' || steps.after.outputs.provider_down == 'true'
        run: >-
          .github/scripts/tell-alerts.sh "🟠 $PRODUCTION_HOST took $TAG although no guest turn answered, on the new
          release or on the one it served. The model provider is the likely fault. The recheck smokes it every 15
          minutes for $RECHECK_MINUTES minutes."

  recheck-production:
    name: Recheck production after a provider failure
    needs: production
    if: needs.production.outputs.provider_down == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: web-production
    concurrency:
      group: recheck-production
      cancel-in-progress: true
    env:
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
      SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Write the installation's identity file
        env:
          DEPLOYMENT_JSON: ${{ vars.DEPLOYMENT_JSON }}
        run: .github/scripts/write-deployment-config.sh && .github/scripts/deploy-prove-red.sh identity
      - name: Smoke the domain every 15 minutes
        env:
          WATCH: ${{ needs.production.outputs.watch }}
          CURRENT: ${{ needs.production.outputs.current }}
          HOST: ${{ vars.PRODUCTION_HOST }}
          MOVE_BACK: promote
        run: .github/scripts/deploy-recheck.sh
