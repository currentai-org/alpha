# The scenario suite (Playwright), in two jobs.
#
# - `mock-model` runs on every pull request, a fork's included, and on every merge queue batch. It
#   reads no secret: the app, Postgres and a mock OpenAI-compatible model (aimock, answering from
#   web/e2e/mock-model/fixtures.json) all run on the runner, and the @mock-model scenarios drive them
#   (web/scripts/mock-model-e2e.sh). The self-host smoke (selfhost.yml) runs beside it.
# - `provider-contract` runs the @provider-contract scenarios against real models, on a Vercel preview of
#   the queue batch that the job deploys itself: the Vercel project is not connected to this repository,
#   so nothing else builds one. It runs only for a queue batch (a merge_group event, or a push to one of
#   Mergify's `mergify/merge-queue/` branches), never for Dependabot, and never in a fork of this repository.
#   It runs in the `merge-queue-e2e` environment. That environment never holds VERCEL_TOKEN: the token can
#   deploy every project on the Vercel team, and a queue batch runs code no maintainer has approved yet,
#   including edits to this file. Only deploy.yml's jobs hold it, on main and on release tags. So until
#   previews are built by Vercel's own Git integration, this job finds no token and skips.
#
# With no secrets set (a fork, or the environment as it is today) `provider-contract` says so in a
# notice and passes.
name: E2E

on:
  pull_request:
  merge_group:
  push:
    branches: ["mergify/merge-queue/**"]

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-model:
    name: scenario suite against a mock model
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d alpha_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm exec playwright install --with-deps chromium

      - name: Migrate the test database
        working-directory: web
        run: pnpm db:migrate

      - name: Scenario suite against the mock model
        working-directory: web
        run: ./scripts/mock-model-e2e.sh --output=test-results/mock-model-playwright

      - name: Upload the report and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mock-model-e2e
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  provider-contract:
    name: provider-contract scenarios against real models
    if: >-
      (github.event_name == 'merge_group' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/mergify/merge-queue/'))) &&
      !github.event.repository.fork &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]' &&
      !startsWith(github.event.merge_group.head_ref || github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: merge-queue-e2e
    permissions:
      contents: read
      pull-requests: read # to read who opened each pull request in the batch
    env:
      HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
      VERCEL_CLI: vercel@65.14.0
    steps:
      - name: Are the secrets here?
        id: gate
        env:
          SCENARIO_ENV: ${{ secrets.SCENARIO_ENV }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$SCENARIO_ENV" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ] || [ -z "$VERCEL_PROJECT" ]; then
            echo "::notice title=e2e skipped::SCENARIO_ENV or VERCEL_TOKEN (merge-queue-e2e environment), VERCEL_SCOPE or VERCEL_PROJECT is not set, so the provider-contract scenarios did not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      # A Vercel preview build gets every Preview variable on the project, so only code from people trusted
      # with this repository reaches one: every pull request in the batch must be opened by an account with
      # write, maintain or admin permission on this repository itself. Membership of the owning organisation
      # is not enough, since an organisation member may have no access to this repository. Any other batch
      # deploys nothing and is covered by the mock-model job alone. A commit's author is not checked, since
      # anyone can write any name on a commit; the pull request's opener is the account GitHub saw.
      - name: Is every pull request in the batch from someone with write access
        id: trusted
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --paginate --jq '.commits[].sha' | while read -r sha; do
            gh api "repos/$REPO/commits/$sha/pulls" --jq '.[] | select(.state == "open") | .number'
            sleep 1
          done | sort -u)
          if [ -z "$prs" ]; then
            echo "::notice title=no preview::no open pull request found in this batch, so no preview was deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ok=true
          for pr in $prs; do
            login=$(gh api "repos/$REPO/pulls/$pr" --jq .user.login)
            sleep 1
            perm=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission 2>/dev/null || echo none)
            echo "#$pr: $login ($perm)"
            case "$perm" in admin | maintain | write) ;; *) ok=false ;; esac
            sleep 1
          done
          if [ "$ok" != true ]; then
            echo "::notice title=no preview::a pull request in this batch was not opened by someone with write access to this repository, so no preview was deployed and the provider-contract scenarios did not run."
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Deploy this batch's preview
        id: preview
        if: steps.gate.outputs.run == 'true' && steps.trusted.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "$VERCEL_CLI" link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          url=$(npx --yes "$VERCEL_CLI" deploy --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "preview: $url (from $HEAD_SHA)"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.run == 'true' && steps.trusted.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.gate.outputs.run == 'true' && steps.trusted.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install
        if: steps.gate.outputs.run == 'true' && steps.trusted.outputs.ok == 'true'
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm exec playwright install --with-deps chromium

      - name: Provider-contract scenarios
        if: steps.gate.outputs.run == 'true' && steps.trusted.outputs.ok == 'true'
        working-directory: web
        env:
          # The contents of a dotenv file: one KEY=value per line, with the keys web/.env.example names.
          SCENARIO_ENV: ${{ secrets.SCENARIO_ENV }}
          SCENARIO_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -a
          # shellcheck source=/dev/null
          . <(printf '%s\n' "$SCENARIO_ENV")
          set +a
          pnpm test:e2e:scenarios --grep @provider-contract

      - name: Upload the report
        if: failure() && steps.gate.outputs.run == 'true' && steps.trusted.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
