# Publishes Alpha's container image to GHCR as ghcr.io/<this repo>, for amd64 and arm64.
#
# web/Dockerfile built with APP_SURFACE=chat: the chat at the root of its host, the build
# selfhost/compose.yaml makes. Each platform builds natively on its own runner (no QEMU), with an SBOM
# and buildx's provenance, and is pushed by digest only. The publish job joins the two into one
# multi-arch index, tags it, attests its build provenance (`gh attestation verify`) and signs it with
# cosign keyless (`cosign verify`). deploy/README.md has both verify commands.
#
# Three blocking gates stand between a build and a release tag. Each platform image is scanned for secrets by
# gitleaks over its filesystem (deploy/scan-image.sh) before its digest is handed on. The signed index
# is then pulled by digest into the self-host stack (selfhost/compose.release.yaml, no local build) and
# must answer a guest chat turn. Before it is attested and signed, the index's SBOM is read back from the
# registry and must list packages on every platform (deploy/check-sbom.sh). Each platform image is also
# scanned for known vulnerabilities by Grype, report-only: high and critical counts go to the run summary and
# never fail the run. Only after the blocking gates does the last job put the version tags on that same
# digest, so a version tag never names an image that was not scanned and booted.
#
# It runs only when asked for: on a version tag vX.Y.Z, which gives `X.Y.Z`, `X.Y` and `stable` (a pre-release tag such as vX.Y.Z-rc.1 gets only its own version), and
# on a manual run (workflow_dispatch) from main, which gives `main` and `sha-<commit>`. A manual run from
# any other branch publishes nothing: it fails before any job gets a token that can write the package,
# so an unreviewed branch never reaches it. A push to main publishes nothing, so a new image exists only
# when a release or a person needs one. There is no `latest`: deploy/compose.yaml and
# selfhost/compose.release.yaml pin a version.
#
# No pull_request trigger: a pull request never publishes, and selfhost.yml already builds and smokes
# the image from source on every change to it.
name: Publish image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  # One run per commit or tag, so a later push never cancels an earlier publish half way.
  group: image-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A manual run from a branch other than main stops here, red, and the jobs that push are skipped.
  refuse-branch:
    name: refuse a branch other than main
    if: github.ref_type != 'tag' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Images publish only from main or a vX.Y.Z tag; this run is on $REF."
          exit 1

  build:
    name: build ${{ matrix.platform }}
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Nothing pulls it until the publish job tags the index that holds it.
      packages: write # push this platform's image by digest, untagged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The docker-container driver, which the SBOM and provenance attestations need.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: web/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_SURFACE=chat
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      # What ships, read back from the registry by digest: a file a build stage copied in is covered
      # even when no source scan saw it. A finding fails the job, so the digest is never handed on.
      - name: Scan the image filesystem for secrets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: ./deploy/scan-image.sh "$IMAGE@$DIGEST"

      # Report-only. Grype reads the platform image from the registry by digest, on this platform's own runner,
      # so the platform it scans is the one it was built for. A scan that cannot run, or a finding of any
      # severity, never fails the job: the counts below are for a person to read before a release.
      # To make high or critical findings block, add `fail-build: true` and `severity-cutoff: high` here and
      # drop `continue-on-error`.
      - name: Scan the image for known vulnerabilities (report only)
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: registry:${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: false
          output-format: json
          only-fixed: false

      - name: Vulnerability summary (report only)
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ steps.grype.outputs.json }}
          PLATFORM: ${{ matrix.platform }}
          OUTCOME: ${{ steps.grype.outcome }}
        run: |
          {
            echo "### Known vulnerabilities, $PLATFORM (Grype, report only)"
            echo
            if [ "$OUTCOME" != success ] || [ ! -s "$REPORT" ]; then
              echo "The scan did not run (outcome: $OUTCOME). Nothing was counted."
            else
              jq -r '
                [.matches[] | .vulnerability.severity] as $sev
                | "| Critical | High | Medium | Low | Other |\n|---|---|---|---|---|\n| \([$sev[] | select(. == "Critical")] | length) | \([$sev[] | select(. == "High")] | length) | \([$sev[] | select(. == "Medium")] | length) | \([$sev[] | select(. == "Low")] | length) | \([$sev[] | select(. as $s | ["Critical","High","Medium","Low"] | index($s) | not)] | length) |"' "$REPORT"
              echo
              echo "Of the high and critical, with a fix available (package: vulnerability):"
              echo
              echo '```'
              jq -r '[.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High") | select((.vulnerability.fix.versions // []) | length > 0) | "\(.artifact.name) \(.artifact.version): \(.vulnerability.id) (\(.vulnerability.severity)), fixed in \(.vulnerability.fix.versions | join(", "))"] | unique | .[:40][]' "$REPORT"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish, attest and sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write # tag the index, push the signature and the attestation
      id-token: write # this run's OIDC identity, for keyless signing and the attestation
      attestations: write # record the provenance attestation on the repository
    steps:
      # For deploy/check-sbom.sh only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The candidate tag only: the version tags wait for the smoke (the `release-tags` job).
          tags: |
            type=sha,format=long,prefix=sha-

      # One index over both platform digests, carrying their SBOM and provenance manifests with it.
      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<<"$TAGS"
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "expected 2 platform digests, found ${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Index digest
        id: index
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "no index digest for $IMAGE:$TAG" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      # The SBOM is read back from the registry, per platform, before anything vouches for the index: a build
      # that produced an empty or missing SBOM fails here, not after it was attested and signed.
      - name: SBOM lists packages on every platform
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: ./deploy/check-sbom.sh "$IMAGE@$DIGEST" 2

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Keyless: the certificate names this workflow file and the ref it ran on, which is what
      # `cosign verify --certificate-identity-regexp` checks.
      - name: Sign with cosign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: echo "### Candidate $IMAGE@$DIGEST (signed, not yet released)" >> "$GITHUB_STEP_SUMMARY"

  # The self-host stack on the image as a stranger gets it: pulled by digest, never built here.
  # compose.release.yaml drops `build`, and ALPHA_IMAGE names the digest, so what boots is the signed
  # index the publish job made. Fails the run before any version tag exists.
  smoke:
    name: self-host smoke on the pulled image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # pull the candidate by digest
    env:
      MODEL_CACHE_KEY: selfhost-gguf-qwen2.5-0.5b-instruct-q4_k_m-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Model directory
        run: |
          echo "LOCAL_MODELS_DIR=$RUNNER_TEMP/selfhost-models" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/selfhost-models"

      # Restore only, as in selfhost.yml.
      - name: Restore the model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.LOCAL_MODELS_DIR }}
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Boot the pulled image and chat
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          COMPOSE_FILE: compose.yaml:compose.release.yaml
        run: |
          export ALPHA_IMAGE="$IMAGE@$DIGEST"
          SMOKE_DOWN=1 ./selfhost/smoke.sh
          echo "smoke ran $ALPHA_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # The version tags, put on the digest that passed the scan and the smoke. Retagging moves no bytes,
  # and the signature and attestation are on the digest, so they stay valid.
  release-tags:
    name: tag the verified digest
    needs: [publish, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # add tags to the index
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Tag the digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<<"$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "no tags to apply" >&2; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          {
            echo "### Released $IMAGE@$DIGEST"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
